<script>
'use strict';
/* =========================================================
   FACE v2 — full-screen expressive face.
   Core: Canvas2D + springs.  Add-ons (each optional, each fails soft):
   #7 Pixi + pixi-filters (GPU bloom / CRT / RGB split / glitch / shockwave)
   #8 tsParticles confetti · #3 ZzFX beeps · #4 Tone.js tunes + mood pad
   #5 Meyda ears · #6 transformers.js Whisper + sentiment (worker)
   #2 MediaPipe Face Landmarker · #1 Human (emotion/gaze)
   #9 RoboEyes macro-anims (h/v flicker, cyclops, tired) · #10 kaia-face's 32-expression vocabulary
   ========================================================= */
const TAU=Math.PI*2, R=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,k)=>a+(b-a)*k, pick=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const eyeL=document.createElement('canvas'), ex=eyeL.getContext('2d');
const g1=document.createElement('canvas'), g1x=g1.getContext('2d');
const g2=document.createElement('canvas'), g2x=g2.getContext('2d');
let W,H,DPR,S,dprCap=2;

const THEMES={cyan:[90,225,255],mint:[120,255,190],amber:[255,196,90],pink:[255,130,200],white:[235,240,255]};
let theme='cyan';
const TINT={love:[255,105,170],angry:[255,70,60],sad:[90,140,255],sleep:[175,160,255],star:[255,215,90]};

// LANDSCAPE: try a real orientation lock (Android needs fullscreen for it); if the screen is still
// portrait, draw the face sideways with a CSS rotation and remap touch/camera/tilt to match.
let rot90=false;
function lockLandscape(){try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}
function resize(){DPR=Math.min(dprCap,window.devicePixelRatio||1);rot90=innerHeight>innerWidth;
  W=rot90?innerHeight:innerWidth;H=rot90?innerWidth:innerHeight;
  for(const c of [cv,document.getElementById('gl')]){if(!c)continue;c.classList.toggle('rot',rot90);c.style.width=W+'px';c.style.height=H+'px'}
  for(const c of [cv,eyeL]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)}
  g1.width=Math.ceil(W/6);g1.height=Math.ceil(H/6);g2.width=Math.ceil(W/16);g2.height=Math.ceil(H/16);
  S=Math.min(W*0.27,H*0.46);
  if(gpu)gpuResize();
}
addEventListener('resize',()=>resize());

/* ---------- tiny event bus: the core fires, add-ons listen ---------- */
const bus={};const on=(e,f)=>(bus[e]=bus[e]||[]).push(f);
const fire=(e,d)=>(bus[e]||[]).forEach(f=>{try{f(d)}catch(x){console.warn(e,x)}});

/* ---------- springs ---------- */
class Sp{constructor(v){this.v=v;this.u=0;this.t=v}step(dt,k,c){this.u+=(k*(this.t-this.v)-c*this.u)*dt;this.v+=this.u*dt;return this.v}}
const EYEKEYS={w:1,h:1,r:.3,dx:0,dy:0,rot:0,lt:0,la:0,lb:0,heart:0,spiral:0,star:0,x:0};
const FACEKEYS={tilt:0,bounce:0,jitter:0,blush:0,mv:0,mc:0,mo:0,mw:.3,mx:0,wv:0,tr:0,tg:0,tb:0,lx:0,ly:0};
const L={},Rr={},F={};
for(const k in EYEKEYS){L[k]=new Sp(EYEKEYS[k]);Rr[k]=new Sp(EYEKEYS[k])}
for(const k in FACEKEYS)F[k]=new Sp(FACEKEYS[k]);
const look={x:new Sp(0),y:new Sp(0)};

/* ---------- expressions (originals + kaia-face's vocabulary, drawn my way) ---------- */
const EX={
 neutral:{},
 happy:{e:{lb:.42,h:.96},f:{mv:1,mc:.55,mw:.42,bounce:.15}},
 laugh:{e:{lb:.58,h:.9,w:1.06},f:{mv:1,mc:.6,mo:.42,mw:.58,bounce:1}},
 giggle:{e:{lb:.62,h:.88},f:{mv:1,mc:.55,mo:.18,mw:.36,bounce:.5,tilt:6}},
 excited:{e:{w:1.08,h:1.12,r:.42},f:{mv:1,mc:.6,mo:.3,mw:.5,bounce:.6}},
 starstruck:{e:{star:1},f:{mv:1,mc:.6,mo:.35,mw:.5,bounce:.4},tint:'star'},
 love:{e:{heart:1},f:{mv:1,mc:.45,mw:.38,blush:1},tint:'love'},
 content:{e:{lt:.26,lb:.5},f:{mv:1,mc:.38,mw:.3,blush:1}},
 wink:{l:{lb:.55,lt:.35},r:{lb:.32},f:{mv:1,mc:.55,mw:.42,tilt:-6}},
 mischievous:{l:{lt:.38,lb:.25},r:{lt:.12,lb:.3},f:{mv:1,mc:.45,mw:.36,mx:.2,tilt:-6}},
 sassy:{e:{lt:.38,la:-5},f:{mv:1,mc:.25,mw:.3,mx:.22,lx:-.6,ly:-.6,tilt:10}},
 stuckup:{e:{lt:.42,dy:-.06},f:{mv:1,mc:-.1,mw:.22,ly:-.8,lx:.4,tilt:12}},
 embarrassed:{e:{lb:.45,h:.95},f:{mv:1,wv:.6,mw:.26,blush:1,lx:-.7,ly:.4}},
 flustered:{e:{lb:.5,w:1.04},f:{mv:1,wv:1,mw:.3,blush:1,jitter:.25}},
 awkward:{e:{lt:.2},f:{mv:1,wv:1,mw:.42,mc:0}},
 surprised:{e:{w:.84,h:1.22,r:.5,dy:-.04},f:{mv:1,mo:.42,mw:.2,mc:0}},
 realized:{e:{w:.9,h:1.18,r:.5,dy:-.05},f:{mv:1,mo:.2,mw:.18}},
 shocked:{e:{w:.62,h:1.3,r:.5,dy:-.06},f:{mv:1,mo:.8,mw:.24,jitter:.2}},
 scared:{e:{w:.7,h:.82,r:.5,dy:-.02},f:{mv:1,mc:-.35,mo:.1,mw:.34,jitter:.7}},
 anxious:{e:{w:.86,h:.9,lt:.12,la:-10},f:{mv:1,wv:.8,mw:.3,jitter:.3}},
 sad:{e:{lt:.28,la:-18,dy:.07,h:.95},f:{mv:1,mc:-.5,mw:.38,tilt:-4},tint:'sad'},
 upset:{e:{lt:.3,la:-14,h:.92},f:{mv:1,mc:-.6,mw:.3,tilt:-9},tint:'sad'},
 crying:{e:{lt:.32,la:-22,dy:.08,h:.92},f:{mv:1,mc:-.6,mo:.25,mw:.4,jitter:.25},tint:'sad'},
 apologetic:{e:{lt:.3,la:-16,dy:.06},f:{mv:1,mc:.2,mw:.24,ly:.5,tilt:-6,blush:.5}},
 annoyed:{e:{lt:.44,la:9},f:{mv:1,mc:-.08,mw:.28,lx:.65,ly:.1}},
 angry:{e:{lt:.28,la:17,w:1.06,h:.92,dy:.02},f:{mv:1,mc:-.3,mw:.44,jitter:.18},tint:'angry'},
 furious:{e:{lt:.36,la:26,w:1.08,h:.88},f:{mv:1,mc:-.45,mo:.18,mw:.5,jitter:.6},tint:'angry'},
 evil:{e:{lt:.36,la:20,lb:.25},f:{mv:1,mc:.55,mw:.5,mx:.1},tint:'angry'},
 determined:{e:{lt:.32,la:9,h:.95},f:{mv:1,mc:-.05,mw:.34}},
 suspicious:{l:{lt:.44,lb:.2},r:{lt:.2},f:{mv:1,mc:-.15,mw:.24,mx:.25,lx:-.75}},
 curious:{l:{w:1.06,h:1.16},r:{h:.8,lt:.14},f:{tilt:9,mv:1,mo:.12,mw:.16,ly:-.3,lx:.3}},
 listening:{e:{w:1.04,h:1.1,r:.4},f:{mv:1,mc:.12,mw:.16,tilt:8}},
 thinking:{l:{lt:.2},r:{h:1.04},f:{mv:1,mc:-.06,mw:.16,mx:.3,lx:.7,ly:-.75,tilt:-5}},
 confused:{l:{lt:.3,la:-10},r:{w:1.08,h:1.12},f:{mv:1,wv:1,mw:.34,tilt:-8}},
 bored:{e:{lt:.46},f:{mv:1,mc:0,mw:.3,ly:-.7,lx:-.4}},
 tired:{e:{lt:.5,la:-8,dy:.05},f:{mv:1,mc:-.1,mw:.24}},
 yawn:{e:{lt:.62,h:.92},f:{mv:1,mc:0,mo:.75,mw:.26,tilt:-7}},
 sleepy:{e:{lt:.58,dy:.05},f:{mv:.7,mo:.04,mw:.18}},
 exhausted:{e:{lt:.66,dy:.08},f:{mv:1,mo:.18,mw:.22,ly:.6,tilt:9}},
 sleep:{e:{lt:.86,dy:.07,h:.85},f:{mv:0},tint:'sleep'},
 dizzy:{e:{spiral:1},f:{mv:1,mc:-.25,mo:.14,mw:.36}},
};
let expr='neutral',exprUntil=0,base='neutral',quietExpr=false;
function setExpr(name,dur,quiet){const prev=expr;expr=name;exprUntil=dur?now+dur:0;const E=EX[name]||{};
  const tgt=(sp,src)=>{for(const k in EYEKEYS)sp[k].t=(src&&k in src)?src[k]:EYEKEYS[k]};
  tgt(L,Object.assign({},E.e,E.l));tgt(Rr,Object.assign({},E.e,E.r));
  for(const k in FACEKEYS)F[k].t=(E.f&&k in E.f)?E.f[k]:FACEKEYS[k];
  const c=E.tint?TINT[E.tint]:THEMES[theme];F.tr.t=c[0];F.tg.t=c[1];F.tb.t=c[2];
  for(const sp of [L,Rr]){sp.h.u-=1.2;sp.w.u+=0.8}   // anticipation squash
  if(name!=prev)fire('expr',{name,prev,quiet:!!quiet});
}
function relax(){setExpr(base,0,true)}
const asleep=()=>expr=='sleep'||expr=='sleepy';

/* ---------- canvas particles (z, notes, tears, ?, !) ---------- */
const parts=[];
function emit(type,x,y,n=1){for(let i=0;i<n;i++)parts.push({type,x,y,vx:R(-40,40),vy:R(-90,-40),life:0,max:R(1.4,2.4),s:R(.8,1.2),rot:R(-.5,.5)})}

/* ---------- state ---------- */
let now=0,last=performance.now(),blinkT=-9,blinkSide=0,nextBlink=1,dbl=0,nextSacc=0,nextIdle=4,lastTouch=performance.now()/1000,mouthOn=true,cyclops=false;
let touch=null,taps=[],holdTimer=null,rub=0,purring=0,demo=null,tiltX=0,tiltY=0,camLook=null,camT=0,beatRate=2,dance=0,headTilt=0;
let talkUntil=0,flickH=0,flickHA=0,flickV=0,flickVA=0,frameN=0,lookAwayUntil=0,crossUntil=0,forceSleep=false,petName='Pip';
try{petName=localStorage.getItem('face.name')||'Pip'}catch(e){}

function blink(side){blinkT=now;blinkSide=side||0;fire('blink')}
function saccade(){const r=Math.random();if(r<.35){look.x.t=R(-.15,.15);look.y.t=R(-.1,.1)}else if(r<.75){look.x.t=R(-.9,.9);look.y.t=R(-.6,.5)}else{look.x.t+=R(-.2,.2);look.y.t+=R(-.12,.12)}
  if(Math.random()<.3)blink()}
const IDLES=[['curious',2.2],['thinking',2.6],['suspicious',2],['happy',1.6],['bored',2.4],['wink',.9],['excited',1.2],['sassy',1.8],['mischievous',1.6],['awkward',1.8],['determined',1.4],['giggle',1.2]];
// RoboEyes macro animations: laugh = vertical shiver, confused = horizontal shiver (500 ms)
function flick(dir,dur,amp){if(dir=='h'){flickH=now+dur;flickHA=amp}else{flickV=now+dur;flickVA=amp}}
function talk(sec){talkUntil=Math.max(talkUntil,now+sec)}

/* ---------- drawing helpers ---------- */
function rrect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function heartPath(c,s){c.beginPath();c.moveTo(0,s*.35);c.bezierCurveTo(-s*.95,-s*.25,-s*.55,-s*.95,0,-s*.45);c.bezierCurveTo(s*.55,-s*.95,s*.95,-s*.25,0,s*.35);c.closePath()}
function starPath(c,s){c.beginPath();for(let i=0;i<10;i++){const rr=i%2?s*.42:s;const a=-Math.PI/2+i*Math.PI/5;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath()}

function drawEye(sp,side,cx,cy,col,t,big){
  const bl=blinkSide&&blinkSide!=side?0:blinkAmt;
  const w=S*0.82*sp.w.v*big, h=S*1.0*sp.h.v*big*(1-bl*0.93), r=sp.r.v*Math.min(w,h)*1.6;
  const ww=w*(1+bl*0.1);
  ex.save();ex.translate(cx+sp.dx.v*S*side,cy+sp.dy.v*S);ex.rotate((sp.rot.v*side)*Math.PI/180);ex.scale(side,1);
  const rect=1-clamp(Math.max(sp.heart.v,sp.spiral.v,sp.star.v)*1.7,0,1);
  if(rect>0.01){
    // eyelids as clip regions (evenodd: big box minus lid shape). Two clips = intersection.
    const lt=sp.lt.v,la=Math.tan(sp.la.v*Math.PI/180),B=S*3;
    ex.save();
    if(lt>0.003||Math.abs(la)>0.01){const yT=-h/2+lt*h;ex.beginPath();ex.rect(-B,-B,2*B,2*B);ex.moveTo(-ww,-h*2);ex.lineTo(ww,-h*2);ex.lineTo(ww,yT+la*ww);ex.lineTo(-ww,yT-la*ww);ex.closePath();ex.clip('evenodd')}
    if(sp.lb.v>0.003){ex.beginPath();ex.rect(-B,-B,2*B,2*B);ex.ellipse(0,h/2+h*.62-sp.lb.v*h*1.15,ww*.95,h*.62,0,0,TAU);ex.clip('evenodd')}
    ex.globalAlpha=clamp(rect,0,1);
    const gr=ex.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,`rgb(${col.map(v=>Math.min(255,v+70)).join()})`);gr.addColorStop(1,`rgb(${col.join()})`);
    ex.fillStyle=gr;rrect(ex,-ww/2,-h/2,ww,h,r);ex.fill();
    if(!crtOn||!gpu){ex.save();rrect(ex,-ww/2,-h/2,ww,h,r);ex.clip();ex.fillStyle='rgba(0,0,0,.16)';for(let y=-h/2;y<h/2;y+=S*.035)ex.fillRect(-ww/2,y,ww,S*.012);ex.restore()}
    ex.fillStyle='rgba(255,255,255,.32)';rrect(ex,-ww*.32,-h*.36,ww*.2,h*.14,ww*.07);ex.fill();
    ex.restore();
  }
  if(sp.heart.v>0.01){ex.save();ex.globalAlpha=clamp(sp.heart.v,0,1);const pulse=1+0.08*Math.pow(Math.max(0,Math.sin(t*7)),6);ex.scale(pulse*sp.heart.v,pulse*sp.heart.v);ex.fillStyle=`rgb(${col.join()})`;heartPath(ex,S*.62*big);ex.fill();ex.restore()}
  if(sp.star.v>0.01){ex.save();ex.globalAlpha=clamp(sp.star.v,0,1);const pulse=1+.06*Math.sin(t*9);ex.rotate(Math.sin(t*2)*.25);ex.scale(pulse*sp.star.v,pulse*sp.star.v);ex.fillStyle=`rgb(${col.join()})`;starPath(ex,S*.5*big);ex.fill();ex.fillStyle='rgba(255,255,255,.5)';starPath(ex,S*.16*big);ex.fill();ex.restore()}
  if(sp.spiral.v>0.01){ex.globalAlpha=clamp(sp.spiral.v,0,1);ex.rotate(t*7*side);ex.strokeStyle=`rgb(${col.join()})`;ex.lineWidth=S*.075;ex.lineCap='round';ex.beginPath();
    for(let a=0;a<TAU*2.3;a+=.15){const rr=(S*.04+a*S*.034)*big;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;a?ex.lineTo(x,y):ex.moveTo(x,y)}ex.stroke()}
  ex.restore();ex.globalAlpha=1;
}
function drawMouth(cx,cy,col,t){
  const talking=now<talkUntil;
  const mv=Math.max(F.mv.v,talking?1:0)*(mouthOn?1:0);if(mv<0.02)return;
  const w=S*F.mw.v*1.15, curve=F.mc.v*S*.32;
  let open=Math.max(0,F.mo.v)*S*.55;
  if(talking)open+=S*.13*Math.pow(Math.abs(Math.sin(t*17+Math.sin(t*5)*2)),1.5);
  ex.save();ex.globalAlpha=clamp(mv,0,1);ex.translate(cx+F.mx.v*S,cy);ex.strokeStyle=ex.fillStyle=`rgb(${col.join()})`;ex.lineCap='round';ex.lineJoin='round';
  const wv=F.wv.v;
  if(open<S*.03){ex.lineWidth=S*.075;ex.beginPath();
    if(wv>.04){for(let i=0;i<=24;i++){const u=i/24,x=-w/2+u*w;const y=-curve*.25+(curve*1.25)*(1-Math.pow(2*u-1,2))*.8+Math.sin(u*TAU*1.5+t*6)*S*.05*wv;i?ex.lineTo(x,y):ex.moveTo(x,y)}}
    else{ex.moveTo(-w/2,-curve*.25);ex.quadraticCurveTo(0,curve,w/2,-curve*.25)}
    ex.stroke()}
  else{ex.beginPath();ex.moveTo(-w/2,-curve*.25);ex.quadraticCurveTo(0,curve*.6,w/2,-curve*.25);ex.quadraticCurveTo(0,curve+open*1.6,-w/2,-curve*.25);ex.fill()}
  ex.restore();
}
function drawParticle(p,col){
  const a=clamp(1-p.life/p.max,0,1)*clamp(p.life*5,0,1);ex.save();ex.globalAlpha=a;ex.translate(p.x,p.y);ex.rotate(p.rot);ex.fillStyle=ex.strokeStyle=`rgb(${col.join()})`;
  const s=S*.22*p.s;ex.textAlign='center';
  if(p.type=='heart'){ex.fillStyle='rgb(255,110,170)';heartPath(ex,s*.9);ex.fill()}
  else if(p.type=='z'){ex.font=`800 ${s}px system-ui`;ex.fillText('Z',0,0)}
  else if(p.type=='note'){ex.font=`700 ${s*1.1}px system-ui`;ex.fillText(p.s>1?'♫':'♪',0,0)}
  else if(p.type=='?'||p.type=='!'){ex.font=`900 ${s*1.5}px system-ui`;ex.fillText(p.type,0,0)}
  else if(p.type=='spark'){ex.beginPath();for(let i=0;i<8;i++){const rr=i%2?s*.12:s*.5;const an=i*Math.PI/4;ex.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}ex.closePath();ex.fill()}

/* ---------- main loop ---------- */
let blinkAmt=0,fpsE=60,slowFor=0;
function frame(ms){
  const dt=Math.min(.045,(ms-last)/1000);fpsE=fpsE*.95+(1/Math.max(dt,.001))*.05;last=ms;now=ms/1000;const t=now;frameN++;
  const idle=now-lastTouch;
  // ---- autonomous life ----
  if(!demo){
    const night=new Date().getHours()<7;
    base=forceSleep||idle>150||(night&&idle>20)?'sleep':idle>90?'sleepy':idle>45?'bored':'neutral';
    if(exprUntil&&now>exprUntil){exprUntil=0;relax()}
    if(!exprUntil&&expr!=base&&!touch&&!purring&&!hearing)setExpr(base,0,true);
    if(base=='neutral'&&!exprUntil&&!touch&&!hearing&&now>nextIdle){nextIdle=now+R(5,11);const [n,d]=pick(IDLES);setExpr(n,d,true);if(n=='excited')emit('spark',W/2,H*.3,3)}
    if(expr=='sleep'&&Math.random()<dt*0.9)emit('z',W/2+S*.9,H/2-S*.5);
  }
  // look: finger > look-away > camera > tilt > saccades
  if(touch){look.x.t=clamp((touch.x/W-.5)*2.4,-1,1);look.y.t=clamp((touch.y/H-.5)*2.2,-1,1)}
  else if(now<lookAwayUntil){}
  else if(camLook&&now-camT<1.5&&expr!='sleep'){look.x.t=camLook[0];look.y.t=camLook[1]}
  else if(F.lx.t||F.ly.t){look.x.t=F.lx.t+Math.sin(t*.7)*.05;look.y.t=F.ly.t}
  else if(expr=='awkward'){look.x.t=Math.sin(t*2.2)*.8;look.y.t=.2}
  else if(now>nextSacc&&expr!='sleep'){nextSacc=now+(Math.random()<.2?R(.12,.3):R(.7,2.8));saccade()}
  const lx=look.x.step(dt,520,34), ly=look.y.step(dt,520,34);
  const LX=clamp(lx+tiltX,-1.2,1.2), LY=clamp(ly+tiltY,-1.2,1.2);
  // blink (RoboEyes-style: base interval + random variation, occasional double)
  if(expr!='sleep'&&now>nextBlink){blink();nextBlink=now+R(1.8,5.5);dbl=Math.random()<.22?now+.26:0}
  if(dbl&&now>dbl){blink();dbl=0}
  const bt=now-blinkT;blinkAmt=bt<.07?bt/.07:bt<.2?1-(bt-.07)/.13:0;if(!blinkAmt)blinkSide=0;
  // springs
  for(const sp of [L,Rr])for(const k in sp){const stiff=(k=='lt'||k=='lb'||k=='la')?260:200;sp[k].step(dt,stiff,(k=='heart'||k=='spiral'||k=='star')?16:15)}
  F.tilt.t+=0;for(const k in F)F[k].step(dt,(k[0]=='t'&&k.length==2)?60:160,(k[0]=='t'&&k.length==2)?14:16);
  if(dance>0)dance-=dt;
  // ---- render eyes layer ----
  ex.setTransform(DPR,0,0,DPR,0,0);ex.clearRect(0,0,W,H);
  const col=[F.tr.v,F.tg.v,F.tb.v].map(v=>Math.round(clamp(v,0,255)));
  const breath=Math.sin(t*(expr=='sleep'?1.3:2.2));
  const bounce=F.bounce.v*S*.06*Math.abs(Math.sin(t*(dance>0?beatRate*Math.PI:9)));
  const jit=F.jitter.v*S*.012;
  const alt=frameN%2?1:-1;
  const fh=now<flickH?alt*flickHA*S*.05:0, fv=now<flickV?alt*flickVA*S*.03:0;
  const fx=W/2+LX*S*.42+R(-jit,jit)+fh, fy=H/2-S*.06+LY*S*.3-bounce+breath*S*.008+R(-jit,jit)+fv;
  ex.save();ex.translate(fx,fy);ex.rotate((F.tilt.v+headTilt+(expr=='dizzy'?Math.sin(t*4)*8:0))*Math.PI/180);ex.translate(-fx,-fy);
  const sep=S*.66*(1-Math.abs(LX)*.04)*(now<crossUntil?.62:1);
  const pL=1-LX*.07, pR=1+LX*.07;   // fake 3D: the eye on the look side grows a touch
  if(cyclops){drawEye(L,1,fx,fy,col,t,1.3)}
  else{L.w.v*=pL;L.h.v*=pL;Rr.w.v*=pR;Rr.h.v*=pR;
    drawEye(L,1,fx-sep,fy,col,t,1);drawEye(Rr,-1,fx+sep,fy,col,t,1);
    L.w.v/=pL;L.h.v/=pL;Rr.w.v/=pR;Rr.h.v/=pR}
  if(F.blush.v>.02){ex.save();ex.globalAlpha=clamp(F.blush.v,0,1)*.55;ex.fillStyle='rgb(255,110,150)';for(const s of [-1,1]){ex.beginPath();ex.ellipse(fx+s*(sep+S*.12),fy+S*.62,S*.2,S*.09,0,0,TAU);ex.fill()}ex.restore()}
  drawMouth(fx,fy+S*.86,col,t);
  ex.restore();
  ex.setTransform(DPR,0,0,DPR,0,0);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>p.max){parts.splice(i,1);continue}
    if(p.type=='tear'){p.vy+=260*dt;p.vx*=.9}else{p.vy*=.985}p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*.6*(p.type=='spark'?3:1);drawParticle(p,col)}
  const tearRate=expr=='crying'?5:expr=='sad'||expr=='upset'?1.2:0;
  if(tearRate&&Math.random()<dt*tearRate)parts.push({type:'tear',x:fx+(Math.random()<.5?-sep:sep)+R(-S*.2,S*.2),y:fy+S*.42,vx:0,vy:20,life:0,max:1.3,s:.7,rot:0});
  if((expr=='scared'||expr=='anxious'||expr=='awkward')&&Math.random()<dt*.8)parts.push({type:'sweat',x:fx+sep+S*.55,y:fy-S*.4,vx:0,vy:30,life:0,max:1.4,s:.8,rot:.3});
  if((expr=='angry'||expr=='furious')&&Math.random()<dt*(expr=='furious'?3:1.5))parts.push({type:'anger',x:fx+sep+S*.6,y:fy-S*.62,vx:0,vy:-6,life:0,max:.8,s:1,rot:0});
  if(expr=='love'&&Math.random()<dt*2.5)emit('heart',fx+R(-S,S),fy-S*.3);
  fire('tick',{dt,t,fx,fy,sep});
  // ---- composite ----
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  if(!gpu){ // CPU bloom: downscale twice, add back
    g2x.clearRect(0,0,g2.width,g2.height);g2x.drawImage(eyeL,0,0,g2.width,g2.height);
    g1x.clearRect(0,0,g1.width,g1.height);g1x.drawImage(eyeL,0,0,g1.width,g1.height);
    ctx.imageSmoothingEnabled=true;ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.38+breath*.06;ctx.drawImage(g2,0,0,cv.width,cv.height);
    ctx.globalAlpha=.3;ctx.drawImage(g1,0,0,cv.width,cv.height);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
  ctx.drawImage(eyeL,0,0);
  if(!gpu){const vg=ctx.createRadialGradient(cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*.3,cv.width/2,cv.height/2,Math.max(cv.width,cv.height)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,cv.width,cv.height)}
  if(gpu)gpuFrame(dt,t,breath);
  // auto-quality: if the phone can't hold ~35 fps for 3 s, step resolution down once
  if(fpsE<35){slowFor+=dt;if(slowFor>3&&dprCap>1){dprCap=1;resize();status()}}else slowFor=0;
  requestAnimationFrame(frame);
}

let gpu=null,crtOn=true,glitchKick=0,rgbKick=0;
async function startGPU(){
  if(gpu||!window.PIXI||!PIXI.filters)return;
  try{
    const app=new PIXI.Application();
    await app.init({width:W,height:H,resolution:DPR,autoDensity:true,background:'#000',antialias:false,preference:'webgl',autoStart:false,powerPreference:'high-performance'});
    app.ticker.stop();app.canvas.id='gl';document.body.insertBefore(app.canvas,cv.nextSibling);resize();
    const Fl=PIXI.filters;
    const bloom=new Fl.AdvancedBloomFilter({threshold:.22,bloomScale:1.1,brightness:1,blur:9,quality:5});
    const crt=new Fl.CRTFilter({curvature:2.2,lineWidth:2.2,lineContrast:.2,noise:.07,noiseSize:1.1,vignetting:.34,vignettingAlpha:.95,vignettingBlur:.35});
    const rgb=new Fl.RGBSplitFilter({red:{x:-1,y:0},green:{x:0,y:0},blue:{x:1,y:0}});
    const glitch=new Fl.GlitchFilter({slices:8,offset:40,direction:0,fillMode:2,red:{x:4,y:0},blue:{x:-4,y:0}});
    const shock=new Fl.ShockwaveFilter({center:{x:0,y:0},speed:1100,amplitude:22,wavelength:150,brightness:1.25,radius:-1});
    const tex=PIXI.Texture.from(cv);const spr=new PIXI.Sprite(tex);spr.width=W;spr.height=H;app.stage.addChild(spr);

}

function gpuFrame(dt,t,breath){
  const g=gpu;g.tex.source.update();
  const hot=expr=='furious'?1:expr=='evil'?.6:expr=='angry'?.3:0;
  glitchKick=Math.max(0,glitchKick-dt*2.5);const gl=Math.max(hot*(Math.random()<.25?1:0),glitchKick);
  g.glitch.enabled=gl>.05;if(g.glitch.enabled&&frameN%3==0){g.glitch.seed=Math.random();g.glitch.offset=20+gl*60;g.glitch.refresh&&g.glitch.refresh()}
